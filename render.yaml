services:
  - type: web
    name: computer-sales-system
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/lib/computer-sales
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: computer-sales-data
      mountPath: /var/lib/computer-sales
      sizeGB: 1
